version: '3.8'

services:
  playmate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playmate-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - COZE_PROJECT_ENV=PROD
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
